<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>タイムカプセル｜霞ノ杜小学校</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/layout-municipal.css" />
  <link rel="stylesheet" href="../../css/login-modal.css" />
  <script>window.__TOKEN_RESOURCE_KEY__ = "ext:kasuminomori-shougakkou"</script>
<script src="../../token-gate.js" defer></script>
  <script src="../../js/school-login.js" defer></script>
  <script src="../../js/school-shell.js" defer></script>
</head>
<body data-school-home="../../" data-sgn-base="../../" data-sgn-active="contact">
  <div id="site-root">
    <div class="sgn-site">
      <div class="sgn-body">
        <div class="sgn-col-main">
          <h1 class="sgn-page-title" id="year-title">タイムカプセル</h1>
          <p class="sgn-crumbs"><a href="../">歴代一覧</a></p>
          <p>当該年度の保管記録です。認証後にご覧いただけます。</p>
          <p style="font-size:12px;color:#666;">お問い合わせページのFAQをご参照のうえ、在学時の氏名と生年月日でログインしてください。</p>
          <p><a href="../">← 年一覧へ</a></p>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var y = (location.pathname.match(/\/(\d{4})\//) || [])[1] || "";
      if (y) document.getElementById("year-title").textContent = y + "年度 タイムカプセル";
    })();
  </script>
</body>
</html>
