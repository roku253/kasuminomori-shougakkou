<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>歴代タイムカプセル｜霞ノ杜小学校</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/layout-municipal.css" />
  <link rel="stylesheet" href="../../css/login-modal.css" />
  <script>window.__TOKEN_RESOURCE_KEY__ = "ext:kasuminomori-shougakkou"</script>
  <script src="../../token-gate.js" defer></script>
  <script src="../../js/school-login.js" defer></script>
  <script src="../../js/school-shell.js" defer></script>
</head>
<body data-sgn-base="../../" data-sgn-active="home">
  <div id="site-root">
    <div class="sgn-site">
      <div class="sgn-body">
        <div class="sgn-col-main">
          <h1 class="sgn-page-title">卒業クラス別 保管一覧</h1>
          <p class="sgn-crumbs"><a href="../../">ホーム</a> ／ <a href="../../contact/">お問い合わせ</a> ／ タイムカプセル</p>
          <p class="pdf-gate-msg" style="display:block;font-size:12px;color:#888;">卒業生の方はログイン後に2017〜2026年度の一覧から保管を閲覧できます（2021年度のみ公開）。</p>
          <div class="pdf-catalog" id="tc-catalog"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var years = [];
      for (var y = 2026; y >= 2017; y--) years.push(y);
      var root = document.getElementById("tc-catalog");
      years.forEach(function (year) {
        var block = document.createElement("section");
        block.className = "pdf-year-block";
        block.setAttribute("data-year", String(year));
        var h = document.createElement("h3");
        h.className = "pdf-year-title";
        h.textContent = year + "年度";
        block.appendChild(h);
        var row = document.createElement("div");
        row.className = "pdf-issue-row";
        if (year === 2021) {
          var a = document.createElement("a");
          a.href = "./2021/";
          a.textContent = "閲覧";
          row.appendChild(a);
        } else {
          row.innerHTML = '<span style="color:#666;">準備中</span>';
        }
        block.appendChild(row);
        root.appendChild(block);
      });
      if (window.KnSchoolLogin && window.KnSchoolLogin.applyYearFilter) {
        window.KnSchoolLogin.applyYearFilter();
      }
    })();
  </script>
</body>
</html>
