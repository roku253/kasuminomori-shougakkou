  <script>
    (function () {
      var el = document.getElementById("kn-tc-access");
      if (!el) return;
      var key = "kn_tc_access_count_v1";
      var n = 47;
      try {
        var v = parseInt(localStorage.getItem(key) || "47", 10);
        if (!isFinite(v) || v < 47) v = 47;
        v += 1;
        localStorage.setItem(key, String(v));
        n = v;
      } catch (e) { /* ignore */ }
      el.textContent = "アクセス回数：" + n + "回";
    })();
  </script>
