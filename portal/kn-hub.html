  <script>
    (function () {
      function goGate() {
        var base = document.body.getAttribute("data-sgn-base") || "../";
        if (base.charAt(base.length - 1) !== "/") base += "/";
        location.replace(base + "portal/kn-gate.html");
      }
      try {
        if (sessionStorage.getItem("kn_graduate_auth_v1") !== "1") goGate();
      } catch (e) {
        goGate();

    })();
